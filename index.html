<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BicycleSim" />
    <meta name="theme-color" content="#151719" />
    <title>Bicycle Sim</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #151719;
        overflow: hidden;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh; /* fallback */
        height: 100dvh; /* fits the *visible* viewport on iOS Safari (excludes toolbars) */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: absolute;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
